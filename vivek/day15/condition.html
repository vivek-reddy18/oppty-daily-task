<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Javascript Conditions  -->
     <h1>Javascript Conditions</h1>
     <input type="number" id="age" placeholder="Enter your age">
     <button onclick="checking()">Check</button>
     <p id="result"></p>


     <!-- Right to vote- if condition -->
      <script>
        function checking(){
            let age=document.getElementById("age").value;
            let output="";
            if(age>=18){
            document.getElementById("result").innerHTML="you can vote" + output;
            }
            else{
            document.getElementById("result").innerHTML="you can't vote" + output;
           }
        }

      </script>

      <!-- greatest of three numbers- if else if -->
       <input type="number" id="num1" placeholder="Enter a number">
       <input type="number" id="num2" placeholder="Enter a number">
       <input type="number" id="num3" placeholder="Enter a number">
       <button onclick="check()">Check</button>
       <p id="result1"></p>

       <script>
        function check(){
            let num1=document.getElementById("num1").value;
            let num2=document.getElementById("num2").value;
            let num3=document.getElementById("num3").value;
            let output="";
            if(num1>num2 && num1>num3){
                document.getElementById("result1").innerHTML="num1 is big" + output;
            }
            else if(num2>num3){
                document.getElementById("result1").innerHTML="num2 is big" + output;
            }
            else{
            document.getElementById("result1").innerHTML="num3 is big" + output;
            }
        }
       </script>

       <!-- Calculator- switch -->
        <h1> calculator</h1>
        <p id="result3"></p>
        <script>
            let a=10;
            let b=20;
            let operator="*";
            let output;

            switch(operator){
                case "+":
                    output= a+b;
                    break;
                case "-":
                    output=a-b;
                    break;
                case "*":
                    output=a*b;
                    break;
                case "/":
                    output=a/b;
                    break;
                default:
                    output="invalid operator";
            }
             document.getElementById("result3").innerHTML="result: " + output;
        </script>

        <!-- Boolean -->

        <h1>Boolean condition</h1>
        <p id="bc"></p>
        <script>
            let israining=true;

            if(israining){
                document.getElementById("bc").innerHTML="take a umbrella";
            }
            else{
                document.getElementById("bc").innerHTML="no need to take umbrella";

            }
        </script>
        

         
</body>
</html>
