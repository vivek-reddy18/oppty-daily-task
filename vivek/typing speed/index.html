<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Typing Speed Test</h1>

    <div class="time-box">
        <label>Select Time:</label>
        <select id="timeSelect">
            <option value="120" selected>120 Seconds</option>
            <option value="180">180 Seconds</option>
        </select>
        <span>⏱ Time Left: <b id="time">0</b>s</span>
    </div>

    <div id="paragraph" class="paragraph">
        Click Start to begin typing test...
    </div>

    <textarea id="input" placeholder="Start typing here..." disabled></textarea>

    <div class="buttons">
        <button onclick="startTest()">Start</button>
        <button onclick="endTest()">End</button>
    </div>

    <div id="result" class="result"></div>

</div>

<script src="script.js"></script>
</body>
</html>
