<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #000;            
    color: #fff;                 
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: #111;            
    width: 420px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255,255,255,0.1);
}

h1 {
    text-align: center;
    margin-bottom: 15px;
    color: #fff;
}

.time-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    font-size: 14px;
}

.paragraph {
    background: #222;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 14px;
    color: #fff;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 10px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #000;
    color: #fff;
}

textarea::placeholder {
    color: #aaa;
}

textarea:disabled {
    background: #222;
}

.buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

button {
    width: 48%;
    padding: 10px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #1e4fd8;
}

.result {
    margin-top: 15px;
    padding: 10px;
    background: #222;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.6;
}

</style>
<body>

<div class="container">

    <h1>Typing Speed Test</h1>

    <div class="time-box">
        <label>Select Time:</label>
        <select id="timeSelect">
            <option value="30">30 Seconds</option>
            <option value="60" selected>60 Seconds</option>
            <option value="120">120 Seconds</option>
        </select>
        <span>⏱ Time Left: <b id="time">0</b>s</span>
    </div>

    <div id="paragraph" class="paragraph">
        Click Start to begin typing test...
    </div>

    <textarea id="input" placeholder="Start typing here..." disabled></textarea>

    <div class="buttons">
        <button onclick="startTest()">Start</button>
        <button onclick="endTest()">End</button>
    </div>

    <div id="result" class="result"></div>

</div>

<script src="script.js"></script>
</body>
</html>
