<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .img {
            width: 100px;
            height: 100px;
            background-color: blue;
            padding: 20px;

        }

        .one {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            animation: scroll 20s linear infinite;
            animation: scroll 12s linear infinite reverse;


        }

        @keyframes scroll {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(100%);
            }
        }

        .big-animate {
            opacity: 0;
            transform: translateY(100px) scale(0.9);
            animation: bigEntry 1.2s ease-out forwards;
        }

        @keyframes bigEntry {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>
    <section class="one">
        <img src="check-solid-full.svg" class="img">
        <img src="check-solid-full.svg" class="img">
        <img src="check-solid-full.svg" class="img">
        <img src="check-solid-full.svg" class="img">
        <img src="check-solid-full.svg" class="img">
        <img src="check-solid-full.svg" class="img">

        <img src="check-solid-full.svg" class="img">
        <img src="check-solid-full.svg" class="img">
        <img src="check-solid-full.svg" class="img">
        <img src="check-solid-full.svg" class="img">
        <img src="check-solid-full.svg" class="img">
        <img src="check-solid-full.svg" class="img">
    </section>
    <h1 class="big-animate">Big Animation Text</h1>

</body>

</html>
