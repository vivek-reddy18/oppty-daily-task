<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      text-align: center;
      background-color: #f0f8ff;
    }

    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      color: yellow;
    }

    header h1 {
      color: yellow;
      margin-bottom: 15px;
    }

    nav a {
      display: inline-block;
      background-color: red;
      color: white;
      text-decoration: none;
      margin: 0 10px;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s, transform 0.2s;
    }

    nav a:hover {
      background-color: darkred;
      transform: scale(1.05);
    }

    /* Individual button colors */
    nav a.html-btn {
      background-color: #e74c3c;
    }

    nav a.html-btn:hover {
      background-color: #c0392b;
    }

    nav a.css-btn {
      background-color: #3498db;
    }

    nav a.css-btn:hover {
      background-color: #1d6fa5;
    }
  </style>
</head>
<body>
  <header>
    <h1><strong>HTML Tutorial Series</strong></h1>
    <nav>
      <a href="index.html" target="_blank" title="html" class="html-btn">HTML</a>
      <a href="style.css" target="_blank" title="css" class="css-btn">CSS</a>
    </nav>
  </header>

  <div class="container">
    <div id="header"></div>
  </div>
</body>
</html>
