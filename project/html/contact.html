            <button id="openSearch"><img src="../images/magnifying-glass-solid-full.svg" class="img"></button>

            <div class="search-box" id="searchBox">
                <input type="text" placeholder="Search here...">
                <button id="closeSearch">&times;</button>
            </div>

            <script>
                const openSearch = document.getElementById("openSearch");
                const closeSearch = document.getElementById("closeSearch");
                const searchBox = document.getElementById("searchBox");

                openSearch.addEventListener("click", () => {
                    searchBox.classList.add("active");
                });

                closeSearch.addEventListener("click", () => {
                    searchBox.classList.remove("active");
                });
            </script>

    <section class="header1">
        <div class="container3">
            <img src="../images/logo-dark.png" class="img1">
            <p>BLOG DEMO FOR A THEMEFOREST BESTSELLER</p>

        </div>
        <div class="container4">

           <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3805.211009591722!2d78.3348749!3d17.49743785!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bcb93cc06441feb%3A0xb86e25522bc1c0dc!2sVijaya%20Lakshmi%20Enclave!5e0!3m2!1sen!2sin!4v1767336138442!5m2!1sen!2sin" width="1100" height="550" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <div class="map">
                <h2>📍 Find Us on Google Maps</h2>
                <div class="on">
                   <button class="open" onclick="openMap()">Open Location</button>
                </div> 
                <script>
                    function openMap() {
                    
                        const address = "108/43 Vijaya Lakshmi Enclave 1st Floor H No 2 PJR Enclave Rd Gangaram ICRISAT Colony Hyderabad Telangana 500050";

                    
                        const mapURL =
                            "https://www.google.com/maps/search/?api=1&query=" +
                            encodeURIComponent(address);

                        
                        window.open(mapURL, "_blank"); 
                    }
                </script>

         </div>   
        
        <div class="container5">
            <h3>CONTACT</h3>
            <h2>Contact me for any inquiries</h2>
            <div class="line"></div>
        </div>
        <div class="container6">

            <form id="contactForm">
                <input type="text" placeholder="YOUR FULL NAME" required><br><br>
                <input type="email" placeholder="YOUR E-MAIL ADDRESS" required><br><br>
                <textarea rows="6" placeholder="WRITE YOUR MESSAGE" required></textarea><br><br>
                <button type="submit" class="contact">CONTACT ME</button>
            </form>


            <div id="successMsg" class="success-message">
                👍 THANK YOU FOR YOUR MESSAGE. IT HAS BEEN SENT.
            </div>

        </div>

        <script>
            document.getElementById("contactForm").addEventListener("submit", function (e) {
                e.preventDefault();

                const successMsg = document.getElementById("successMsg");
                successMsg.style.display = "block";

                this.reset();


                setTimeout(() => {
                    successMsg.style.display = "none";
                }, 5000);
            });
        </script>


        </div>

            <button class="toTop">&#8679</button>
        </div>
        <script>
            const toTop = document.querySelector(".toTop");
            window.addEventListener("scroll", () => {
                if (window.scrollY > 40) {
                    toTop.style.opacity = "1";
                } else {
                    toTop.style.opacity = "0";
                }
            })
            toTop.addEventListener("click", () => {
                window.scrollTo(0, 0)
            })
        </script>
    </section>
